{% extends "base.html" %}

{% block title %}删除题目 - Kahoot{% endblock %}

{% block content %}
<div class="card">
    <h3>确认删除题目？</h3>
    <p class="section-gap">{{ question.text }}</p>
    <form method="post" class="actions-row">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">确认删除</button>
        <a href="{% url 'question_list' %}" class="btn btn-outline">取消</a>
    </form>
</div>
{% endblock %}
