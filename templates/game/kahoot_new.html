{% extends "base.html" %}

{% block title %}新建 Kahoot - Kahoot Studio{% endblock %}

{% block content %}
<div class="studio-header-bar">
    <div class="studio-title-group">
        <a href="{% url 'teacher_dashboard' %}" class="btn-back">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>返回控制台</span>
        </a>
        <h1 class="studio-main-title">新建 Kahoot 测验</h1>
    </div>
    <a href="{% url 'question_list' %}" class="btn btn-outline">
        我的题库 ({{ quiz_set_count }}) →
    </a>
</div>

<div class="card">
    <h3 class="page-title">第一步：命名这套 Kahoot</h3>
    <p class="form-hint">每次新建都会保存为<strong>一套完整题目</strong>，可在题库中复用，也可一键创建房间。</p>
    <form method="post" action="{% url 'kahoot_start' %}" class="section-gap">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Kahoot 名称</label>
            <input type="text" id="title" name="title" class="form-control" required
                   value="{{ pending_title }}" placeholder="例如：七年级地理期中复习">
        </div>
        <div class="kahoot-choice-grid">
            <button type="submit" name="action" value="manual" class="kahoot-choice-card kahoot-choice-button">
                <div class="kahoot-choice-icon">✏️</div>
                <h3 class="kahoot-choice-title">手动编辑出题</h3>
                <p class="kahoot-choice-desc">逐题填写题干与选项，支持单选、多选、判断、简答、词云。</p>
                <span class="kahoot-choice-cta">开始手动出题 →</span>
            </button>
            <button type="submit" name="action" value="ai" class="kahoot-choice-card kahoot-choice-card-ai kahoot-choice-button">
                <div class="kahoot-choice-icon">✨</div>
                <h3 class="kahoot-choice-title">AI 智能生成</h3>
                <p class="kahoot-choice-desc">指定主题与题型配比，由大模型批量生成题目。</p>
                <span class="kahoot-choice-cta">使用 AI 生成 →</span>
            </button>
        </div>
    </form>
</div>

<div class="card section-gap">
    <a href="{% url 'kahoot_import' %}" class="kahoot-choice-card kahoot-choice-card-excel" style="display:block;text-decoration:none;">
        <div class="kahoot-choice-icon">📊</div>
        <h3 class="kahoot-choice-title">Excel 导入题库</h3>
        <p class="kahoot-choice-desc">按固定表头上传 .xlsx，批量导入单选、多选、判断、简答、词云题。</p>
        <span class="kahoot-choice-cta">下载模板并导入 →</span>
    </a>
</div>
{% endblock %}
