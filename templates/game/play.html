{% extends "base.html" %}

{% block title %}游戏 - {{ room.code }}{% endblock %}

{% block content %}
<div id="app" class="play-app">
    <div id="waiting-screen" class="play-waiting">
        <div class="logo logo-sm">Ka<span>hoo</span>t!</div>
        <p class="player-count">你是 <strong>{{ nickname }}</strong></p>
        <p class="player-count">房间号: <strong>{{ room.code }}</strong></p>
        <h2 class="page-title section-gap-lg">等待老师开始游戏...</h2>
        <div class="player-count">已加入: <span id="player-count">0</span> 人</div>
    </div>

    <div id="play-screen" class="play-screen hidden">
        <p class="question-number" id="question-number"></p>
        <div class="timer-bar" id="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
        <div id="question-image-wrap" class="question-image-wrap hidden">
            <img id="question-image" src="" alt="题目图片">
        </div>
        <h2 class="question-text" id="question-text"></h2>

        <div id="options-container" class="play-options"></div>

        <div id="text-answer-group" class="text-answer-group hidden">
            <input type="text" id="text-answer-input" class="form-control text-answer-input"
                   maxlength="100" placeholder="输入你的答案..." autocomplete="off">
            <button type="button" id="submit-text-btn" class="btn btn-primary submit-text-btn"
                    onclick="submitTextAnswer()">提交答案</button>
        </div>

        <button type="button" id="submit-multi-btn" class="btn btn-primary submit-multi-btn hidden"
                onclick="submitMultiAnswer()">提交答案</button>

        <p id="answer-feedback" class="answer-feedback"></p>
        <p id="inter-question-hint" class="inter-question-hint hidden">等待下一题...</p>
    </div>

    <div id="ended-screen" class="play-ended hidden">
        <h2 class="page-title">游戏已结束</h2>
        <p class="text-muted-block">感谢参与本次测验</p>
        <a href="{% url 'index' %}" class="btn btn-primary section-gap-lg">返回首页</a>
    </div>
</div>

<div class="danmaku-rail">
    <div id="danmaku-layer" class="danmaku-layer"></div>
</div>
<div id="danmaku-bar" class="danmaku-bar hidden">
    <input type="text" id="danmaku-input" class="danmaku-input" maxlength="40"
           placeholder="发弹幕..." autocomplete="off">
    <button type="button" class="btn btn-outline danmaku-send" onclick="sendDanmaku()">发送</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
const ROOM_CODE = '{{ room.code }}';
const NICKNAME = '{{ nickname }}';
const INITIAL_STATE = {{ initial_state_json|safe }};

let ws = null;
let sessionId = localStorage.getItem('kahoot_session_' + ROOM_CODE) || '';
let currentQuestionId = null;
let questionStartTime = null;
let timerInterval = null;
let hasAnswered = false;
let selectedOptions = new Set();
let lastAnswerResult = { answered: false, is_correct: false, points: 0 };
let resultRevealTimer = null;
let danmakuEnabled = false;
let joinedReady = false;
const pendingActions = [];
let waitingStatePollTimer = null;

function startWaitingStatePoll() {
    if (waitingStatePollTimer) return;
    waitingStatePollTimer = setInterval(() => {
        if (joinedReady) sendWs({ action: 'get_state' });
    }, 2000);
}

function stopWaitingStatePoll() {
    if (!waitingStatePollTimer) return;
    clearInterval(waitingStatePollTimer);
    waitingStatePollTimer = null;
}

const CHOICE_TYPES = new Set(['single', 'multiple', 'judgment']);
const TEXT_TYPES = new Set(['short_answer', 'word_cloud']);

function sendWs(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
    } else {
        pendingActions.push(data);
    }
}

function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
    }
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}/ws/room/${ROOM_CODE}/`);

    ws.onopen = () => {
        pendingActions.forEach(d => ws.send(JSON.stringify(d)));
        pendingActions.length = 0;
        ws.send(JSON.stringify({
            action: 'join',
            nickname: NICKNAME,
            session_id: sessionId,
        }));
    };

    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleEvent(msg.event, msg.data);
    };

    ws.onclose = () => setTimeout(connect, 2000);
}

function handleEvent(event, data) {
    switch (event) {
        case 'joined':
            sessionId = data.session_id;
            joinedReady = true;
            localStorage.setItem('kahoot_session_' + ROOM_CODE, sessionId);
            applyState(data.state);
            updateDanmakuBar(data.state.status);
            break;
        case 'player_joined':
            document.getElementById('player-count').textContent = data.player_count;
            break;
        case 'state':
            if (joinedReady) applyState(data);
            break;
        case 'game_started':
        case 'question_started':
            clearResultRevealTimer();
            document.getElementById('inter-question-hint').classList.add('hidden');
            applyState(data);
            break;
        case 'question_ended':
            showQuestionResult(data);
            break;
        case 'game_ended':
            applyState(data);
            break;
        case 'answer_received':
            showAnswerFeedback(data);
            break;
        case 'danmaku':
            showDanmaku(data);
            break;
        case 'danmaku_rejected':
            showDanmakuHint(data.message);
            break;
        case 'error':
            alert(data.message);
            break;
    }
}

function applyState(state) {
    document.getElementById('player-count').textContent = state.player_count;
    updateDanmakuBar(state.status);
    hideAllScreens();

    if (state.status === 'waiting') {
        document.getElementById('waiting-screen').classList.remove('hidden');
        startWaitingStatePoll();
    } else {
        stopWaitingStatePoll();
    }

    if (state.status === 'waiting') {
        return;
    }

    if (state.status === 'ended') {
        document.getElementById('ended-screen').classList.remove('hidden');
        clearTimer();
    } else if (state.status === 'playing' && state.question) {
        document.getElementById('play-screen').classList.remove('hidden');
        showQuestion(state);
    } else if (state.status === 'leaderboard') {
        document.getElementById('play-screen').classList.remove('hidden');
        document.getElementById('inter-question-hint').classList.remove('hidden');
        clearTimer();
        document.getElementById('timer-bar').classList.add('hidden');
    }
}

function hideAllScreens() {
    ['waiting-screen', 'play-screen', 'ended-screen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
    });
}

function showQuestion(state) {
    const q = state.question;
    if (currentQuestionId === q.id && hasAnswered && state.status === 'playing') {
        return;
    }
    if (currentQuestionId !== q.id) {
        currentQuestionId = q.id;
        hasAnswered = false;
        selectedOptions = new Set();
        lastAnswerResult = { answered: false, is_correct: false, points: 0 };
        questionStartTime = Date.now();
        clearResultRevealTimer();
        document.getElementById('answer-feedback').textContent = '';
        document.getElementById('inter-question-hint').classList.add('hidden');
    }

    const isChoice = CHOICE_TYPES.has(q.question_type);
    const isText = TEXT_TYPES.has(q.question_type);
    const isMultiple = q.question_type === 'multiple';
    const isJudgment = q.question_type === 'judgment';

    document.getElementById('question-number').textContent =
        `第 ${state.current_question_index + 1} / ${state.total_questions} 题`;
    document.getElementById('question-text').textContent = q.text;
    document.getElementById('timer-bar').classList.remove('hidden');

    const submitMulti = document.getElementById('submit-multi-btn');
    submitMulti.classList.toggle('hidden', !isMultiple || hasAnswered);

    const textGroup = document.getElementById('text-answer-group');
    const textInput = document.getElementById('text-answer-input');
    const textBtn = document.getElementById('submit-text-btn');
    textGroup.classList.toggle('hidden', !isText || hasAnswered);
    if (isText && !hasAnswered) {
        textInput.value = '';
        textInput.disabled = false;
        textInput.maxLength = q.question_type === 'word_cloud' ? 40 : 100;
        textInput.placeholder = q.question_type === 'word_cloud' ? '输入一个词或短语...' : '输入你的答案...';
        textBtn.disabled = false;
    }

    const imgWrap = document.getElementById('question-image-wrap');
    const imgEl = document.getElementById('question-image');
    if (q.image_url) {
        imgEl.src = q.image_url;
        imgWrap.classList.remove('hidden');
    } else {
        imgEl.removeAttribute('src');
        imgWrap.classList.add('hidden');
    }

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    container.classList.remove('judgment-options');
    container.classList.toggle('hidden', !isChoice);

    if (isChoice) {
        container.classList.toggle('judgment-options', isJudgment);
        const colors = ['option-a', 'option-b', 'option-c', 'option-d'];
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${colors[i]}`;
            btn.textContent = opt.text;
            btn.dataset.key = opt.key;
            btn.disabled = hasAnswered;
            if (isMultiple) {
                btn.onclick = () => toggleMultiOption(opt.key, btn);
            } else {
                btn.onclick = () => submitAnswer(opt.key, btn);
            }
            container.appendChild(btn);
        });
    }

    if (!hasAnswered) {
        startTimer(q.time_limit);
    }
}

function startTimer(seconds) {
    clearTimer();
    const fill = document.getElementById('timer-fill');
    fill.style.width = '100%';
    let remaining = seconds;

    timerInterval = setInterval(() => {
        remaining -= 0.1;
        fill.style.width = ((remaining / seconds) * 100) + '%';
        if (remaining <= 0) {
            clearTimer();
            if (!hasAnswered) {
                hasAnswered = true;
                document.getElementById('answer-feedback').textContent = '时间到';
                lockAnswerUi();
            }
        }
    }, 100);
}

function clearTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

function toggleMultiOption(key, btn) {
    if (hasAnswered) return;
    if (selectedOptions.has(key)) {
        selectedOptions.delete(key);
        btn.classList.remove('selected');
    } else {
        selectedOptions.add(key);
        btn.classList.add('selected');
    }
}

function submitTextAnswer() {
    if (hasAnswered) return;
    const text = document.getElementById('text-answer-input').value.trim();
    if (!text) return;
    hasAnswered = true;
    lockAnswerUi();
    sendWs({
        action: 'submit_answer',
        answer_text: text,
        response_time_ms: Date.now() - questionStartTime,
    });
}

function submitMultiAnswer() {
    if (hasAnswered || selectedOptions.size === 0) return;
    hasAnswered = true;
    lockAnswerUi();
    sendWs({
        action: 'submit_answer',
        selected_options: Array.from(selectedOptions).sort(),
        response_time_ms: Date.now() - questionStartTime,
    });
}

function submitAnswer(key, btn) {
    if (hasAnswered) return;
    hasAnswered = true;
    btn.classList.add('selected');
    lockAnswerUi();
    sendWs({
        action: 'submit_answer',
        selected_option: key,
        response_time_ms: Date.now() - questionStartTime,
    });
}

function lockAnswerUi() {
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    document.getElementById('submit-multi-btn').classList.add('hidden');
    const textInput = document.getElementById('text-answer-input');
    const textBtn = document.getElementById('submit-text-btn');
    if (textInput) textInput.disabled = true;
    if (textBtn) textBtn.disabled = true;
}

function showAnswerFeedback(data) {
    lastAnswerResult = {
        answered: true,
        is_correct: data.is_correct,
        points: data.points,
        no_score: data.no_score,
    };
    const fb = document.getElementById('answer-feedback');
    if (data.no_score) {
        fb.textContent = '已提交';
    } else {
        fb.textContent = data.is_correct ? `正确 +${data.points}` : '错误';
    }
}

function clearResultRevealTimer() {
    if (resultRevealTimer) {
        clearTimeout(resultRevealTimer);
        resultRevealTimer = null;
    }
}

function showQuestionResult(state) {
    clearResultRevealTimer();
    clearTimer();
    document.getElementById('timer-bar').classList.add('hidden');
    lockAnswerUi();

    const correctKeys = getCorrectKeys(state);
    if (correctKeys.length) {
        highlightCorrectAnswers(correctKeys);
    }

    const fb = document.getElementById('answer-feedback');
    const q = state.question;
    const isWordCloud = q && q.question_type === 'word_cloud';
    const correctLabel = formatCorrectLabel(q);

    if (lastAnswerResult.answered) {
        if (isWordCloud || lastAnswerResult.no_score) {
            fb.textContent = '已提交';
        } else if (lastAnswerResult.is_correct) {
            fb.textContent = `回答正确 +${lastAnswerResult.points}`;
        } else {
            fb.textContent = correctLabel ? `回答错误，正确答案：${correctLabel}` : '回答错误';
        }
    } else {
        fb.textContent = correctLabel ? `时间到，正确答案：${correctLabel}` : '时间到';
    }

    resultRevealTimer = setTimeout(() => {
        resultRevealTimer = null;
        document.getElementById('inter-question-hint').classList.remove('hidden');
    }, 2500);
}

function getCorrectKeys(state) {
    const q = state.question;
    if (!q) return [];
    if (q.correct_options && q.correct_options.length) {
        return q.correct_options;
    }
    if (q.correct_option) {
        return [q.correct_option];
    }
    return [];
}

function formatCorrectLabel(question) {
    if (!question) return '';
    if (question.question_type === 'short_answer' && question.correct_answer) {
        return question.correct_answer;
    }
    if (TEXT_TYPES.has(question.question_type) && question.question_type !== 'short_answer') {
        return '';
    }
    return getCorrectKeys({ question }).join(', ');
}

function highlightCorrectAnswers(correctKeys) {
    const correctSet = new Set(correctKeys);
    document.querySelectorAll('.option-btn').forEach(btn => {
        const key = btn.dataset.key;
        if (correctSet.has(key)) {
            btn.classList.add('correct');
        } else if (btn.classList.contains('selected')) {
            btn.classList.add('wrong');
        }
    });
}

function updateDanmakuBar(status) {
    const bar = document.getElementById('danmaku-bar');
    if (!joinedReady || status === 'ended') {
        bar.classList.add('hidden');
        danmakuEnabled = false;
    } else {
        bar.classList.remove('hidden');
        danmakuEnabled = true;
    }
}

function showDanmaku(data) {
    const layer = document.getElementById('danmaku-layer');
    const el = document.createElement('div');
    el.className = 'danmaku-item';
    el.textContent = `${data.nickname}: ${data.text}`;
    el.style.right = `${Math.floor(Math.random() * 16)}px`;
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

function showDanmakuHint(message) {
    const input = document.getElementById('danmaku-input');
    const old = input.placeholder;
    input.placeholder = message;
    setTimeout(() => { input.placeholder = old; }, 2000);
}

function sendDanmaku() {
    if (!danmakuEnabled) return;
    const input = document.getElementById('danmaku-input');
    const text = input.value.trim();
    if (!text) return;
    sendWs({ action: 'send_danmaku', text });
    input.value = '';
}

document.getElementById('danmaku-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendDanmaku();
    }
});

document.getElementById('text-answer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        submitTextAnswer();
    }
});

applyState(INITIAL_STATE);
connect();
</script>
{% endblock %}
