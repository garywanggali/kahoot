{% extends "base.html" %}

{% block title %}Kahoot - every question. every answer.{% endblock %}

{% block content %}
<div class="landing-screen-viewport">
    
    <!-- 空间漂浮高质感 3D 机械键帽（支持鼠标视差与物理按压反馈） -->
    <div class="floating-keycaps-stage" id="keycaps-stage">
        <div class="keycap keycap-orange keycap-pos-1" data-speed="0.04" title="ESC">
            <div class="keycap-inner"><span>ESC</span></div>
        </div>
        <div class="keycap keycap-dark keycap-pos-2" data-speed="-0.03" title="Option A">
            <div class="keycap-inner"><span class="key-shape key-shape-a">▲</span></div>
        </div>
        <div class="keycap keycap-dark keycap-pos-3" data-speed="0.05" title="Option B">
            <div class="keycap-inner"><span class="key-shape key-shape-b">◆</span></div>
        </div>
        <div class="keycap keycap-dark keycap-pos-4" data-speed="-0.04" title="Option C">
            <div class="keycap-inner"><span class="key-shape key-shape-c">●</span></div>
        </div>
        <div class="keycap keycap-dark keycap-pos-5" data-speed="0.03" title="Option D">
            <div class="keycap-inner"><span class="key-shape key-shape-d">■</span></div>
        </div>
        <div class="keycap keycap-dark keycap-pos-6" data-speed="-0.05" title="Command">
            <div class="keycap-inner"><span>⌘</span></div>
        </div>
    </div>

    <!-- 核心视觉区：标语 + 撞色输入卡片 (完全单屏零滚动) -->
    <div class="landing-main-flow">
        
        <div class="hero-section">
            <h1 class="hero-headline">
                <span class="headline-black">every question.</span>
                <span class="headline-orange">every answer.</span>
            </h1>
        </div>

        <!-- 3D 翻转控制台 -->
        <div class="flip-wrapper">
            <div class="flip-card" id="main-flip-card">
                
                <!-- 正面：学生端 -->
                <div class="flip-card-side flip-card-front card-industrial">
                    <form method="post" action="{% url 'join_room' %}">
                        {% csrf_token %}
                        <div class="form-group-industrial">
                            <label for="code">房间号</label>
                            <input type="text" id="code" name="code" class="input-industrial input-pin"
                                   placeholder="输入6位房间号" maxlength="6" pattern="[0-9]{6}"
                                   value="{{ code|default:'' }}" required autofocus autocomplete="off">
                        </div>
                        <div class="form-group-industrial">
                            <label for="nickname">昵称</label>
                            <input type="text" id="nickname" name="nickname" class="input-industrial"
                                   placeholder="输入你的昵称" maxlength="50"
                                   value="{{ nickname|default:'' }}" required autocomplete="nickname">
                        </div>
                        <button type="submit" class="btn-industrial-primary">
                            <span>进入游戏</span>
                            <span>→</span>
                        </button>
                    </form>
                    
                    <div class="flip-footer-switch">
                        <button type="button" class="flip-switch-action" onclick="toggleCardFlip(true)">
                            你是出题人？<strong>切换至老师端 ↻</strong>
                        </button>
                    </div>
                </div>

                <!-- 背面：老师端 -->
                <div class="flip-card-side flip-card-back card-industrial">
                    <form method="post" action="{% url 'teacher_login' %}">
                        {% csrf_token %}
                        <div class="form-group-industrial">
                            <label for="teacher_username">用户名</label>
                            <input type="text" id="teacher_username" name="username" class="input-industrial"
                                   placeholder="输入老师用户名" required autocomplete="username">
                        </div>
                        <div class="form-group-industrial">
                            <label for="password">密码</label>
                            <input type="password" id="password" name="password" class="input-industrial"
                                   placeholder="输入管理密码" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-industrial-primary">
                            <span>登录老师控制台</span>
                            <span>→</span>
                        </button>
                    </form>
                    
                    <div class="teacher-extra-links">
                        <a href="{% url 'teacher_register' %}" class="link-mono">邀请码注册账号 →</a>
                    </div>
                    
                    <div class="flip-footer-switch">
                        <button type="button" class="flip-switch-action" onclick="toggleCardFlip(false)">
                            ← <strong>返回学生加入</strong>
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
function toggleCardFlip(flipToTeacher) {
    const card = document.getElementById('main-flip-card');
    if (flipToTeacher === undefined) {
        card.classList.toggle('is-flipped');
    } else if (flipToTeacher) {
        card.classList.add('is-flipped');
        setTimeout(() => {
            const u = document.getElementById('teacher_username');
            if (u) u.focus();
        }, 350);
    } else {
        card.classList.remove('is-flipped');
        setTimeout(() => {
            const codeInput = document.getElementById('code');
            if (codeInput) codeInput.focus();
        }, 350);
    }
}

// 鼠标微视差与键帽物理交互
(function initKeycapsInteraction() {
    const stage = document.getElementById('keycaps-stage');
    if (!stage) return;
    const keycaps = stage.querySelectorAll('.keycap');
    
    // 鼠标轻量视差
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
    window.addEventListener('mousemove', (e) => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        targetX = (e.clientX - cx);
        targetY = (e.clientY - cy);
    }, { passive: true });

    function renderParallax() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        keycaps.forEach(k => {
            const speed = parseFloat(k.getAttribute('data-speed')) || 0.03;
            k.style.setProperty('--mouse-x', `${(currentX * speed).toFixed(2)}px`);
            k.style.setProperty('--mouse-y', `${(currentY * speed).toFixed(2)}px`);
        });
        requestAnimationFrame(renderParallax);
    }
    requestAnimationFrame(renderParallax);

    // 机械按键点击反馈
    keycaps.forEach(k => {
        k.addEventListener('click', () => {
            k.classList.add('keycap-pressed');
            setTimeout(() => k.classList.remove('keycap-pressed'), 180);
        });
    });
})();

if (window.location.search.includes('tab=teacher') || window.location.hash === '#teacher') {
    toggleCardFlip(true);
}
</script>
{% endblock %}
