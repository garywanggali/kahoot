{% extends "base.html" %}

{% block title %}老师登录 - Kahoot{% endblock %}

{% block content %}
<div class="logo">Ka<span>hoo</span>t!</div>
<div class="card section-gap">
    <h2 class="page-title text-center">老师登录</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-control"
                   value="{{ username|default:'' }}" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control" required
                   autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">登录控制台 →</button>
    </form>
    <p class="text-center section-gap">
        还没有账号？<a href="{% url 'teacher_register' %}">邀请码注册</a>
    </p>
    <p class="text-center text-muted-block">
        <a href="{% url 'index' %}">返回首页</a>
    </p>
</div>
{% endblock %}
